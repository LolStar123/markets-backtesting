<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Markets Backtesting evaluation status</title>
  <desc id="desc">Instrumentation display showing 50 registered signals, two windows, 11 positive in both, and 38 non-positive in the stress window.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9d3c4" stroke-width="1"/>
    </pattern>
    <pattern id="cells" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="14" height="8" y="4" rx="1" fill="#c8c1b3"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#9a6a11" stop-opacity=".16"/>
      <stop offset="1" stop-color="#9a6a11" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="8" fill="#f7f4eb"/>
  <rect width="1280" height="360" rx="8" fill="url(#grid)" opacity=".7"/>
  <path d="M0 0H1280V4H0z" fill="#9a6a11"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">
    <text x="56" y="52" fill="#9a6a11" font-size="13" letter-spacing="2.4">MARKETS // BACKTESTING</text>
    <circle cx="1084" cy="47" r="5" fill="#9a6a11"/>
    <text x="1100" y="52" fill="#5f6872" font-size="12" letter-spacing="1.5">RUN COMPLETE</text>
    <text x="56" y="119" fill="#171a1f" font-size="39" font-weight="700" letter-spacing="-1">WALK-FORWARD</text>
    <text x="56" y="161" fill="#171a1f" font-size="39" font-weight="700" letter-spacing="-1">SIGNAL EVALUATION</text>
    <text x="58" y="194" fill="#68717a" font-size="14" letter-spacing=".6">ONE PIPELINE / FIXED RULES / FAILURES RETAINED</text>
    <g transform="translate(56 230)">
      <rect width="1000" height="16" fill="url(#cells)"/>
      <path d="M0 12H220" stroke="#9a6a11" stroke-width="8" stroke-dasharray="14 6"/>
      <text x="1020" y="13" fill="#9a6a11" font-size="12">11 / 50 BOTH</text>
    </g>
    <g transform="translate(56 284)">
      <path d="M0 0H1168" stroke="#c8c1b3"/>
      <text y="25" fill="#68717a" font-size="11" letter-spacing="1.5">REGISTERED</text>
      <text x="112" y="25" fill="#171a1f" font-size="16" font-weight="700">50</text>
      <text x="260" y="25" fill="#68717a" font-size="11" letter-spacing="1.5">WINDOWS</text>
      <text x="348" y="25" fill="#171a1f" font-size="16" font-weight="700">02</text>
      <text x="510" y="25" fill="#68717a" font-size="11" letter-spacing="1.5">POSITIVE / BOTH</text>
      <text x="665" y="25" fill="#9a6a11" font-size="16" font-weight="700">11</text>
      <text x="826" y="25" fill="#68717a" font-size="11" letter-spacing="1.5">STRESS / NON-POSITIVE</text>
      <text x="1050" y="25" fill="#171a1f" font-size="16" font-weight="700">38</text>
    </g>
    <g opacity=".74">
      <path d="M818 82h54l18-19 18 43 20-14 22 41 25-75 24 48 18-11 24 35 29-74 23 42 24-18 32 24 31-38 34 19" fill="none" stroke="#9a6a11" stroke-width="2"/>
      <path d="M818 138H1200V56H818z" fill="url(#fade)" opacity=".4"/>
      <path d="M818 56v82M894 56v82M970 56v82M1046 56v82M1122 56v82M1200 56v82" stroke="#c8c1b3"/>
    </g>
  </g>
</svg>
