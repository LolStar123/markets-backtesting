<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>working example</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <a href="https://atul-kanodia-fieldnotes.atulswaggalicious.chatgpt.site"
          >atul's corner</a
        ><a id="source" href="#">github / source</a>
      </nav>
      <header>
        <p class="eyebrow">a small working example</p>
        <h1 id="title"></h1>
        <p id="description"></p>
      </header>
      <section aria-label="inputs">
        <h2>try it</h2>
        <div id="controls"></div>
        <details>
          <summary>edit the example input</summary>
          <label for="fixture">JSON input</label
          ><textarea id="fixture" spellcheck="false" rows="14"></textarea
          ><button id="apply">run this input</button>
        </details>
        <p id="error" role="alert"></p>
      </section>
      <section aria-label="result">
        <h2 id="summary" aria-live="polite"></h2>
        <dl id="metrics"></dl>
        <div id="chart"></div>
        <div class="table-wrap"><table id="table"></table></div>
        <pre id="catalogue" hidden></pre>
        <div class="actions">
          <button id="json">download result / json</button
          ><button id="csv">download table / csv</button
          ><button id="reset">reset example</button>
        </div>
      </section>
      <section class="explanation">
        <h2>the workflow</h2>
        <p id="workflow"></p>
        <ol id="steps"></ol>
        <p class="scope" id="scope"></p>
      </section>
      <footer>built by atul kanodia · ucl economics</footer>
    </main>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
